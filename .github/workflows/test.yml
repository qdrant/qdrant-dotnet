name: Build

on:
    pull_request:
      types:
        - opened
        - edited
        - synchronize
        - reopened
    
permissions:
  checks: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: | 
          6.x
          8.x

    - name: Build
      run: ./build.sh build
      shell: bash

    - name: Test
      run: dotnet test -c Release --logger:"junit;LogFilePath=$(pwd)/output/test-results/junit-{assembly}-{framework}-test-results.xml" --no-build -f net8.0 --nologo
      shell: bash
      env:
        QDRANT_SERVERLESS_URL: ${{ secrets.QDRANT_SERVERLESS_URL }}
        QDRANT_SERVERLESS_API_KEY: ${{ secrets.QDRANT_SERVERLESS_API_KEY }}
      
    - name: Test Results
      uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
      if: always()
      with:
        fail_on_failure: true
        require_tests: true
        report_paths: '**/output/test-results/junit-*.xml'
