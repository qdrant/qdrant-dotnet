name: Build

on:
    pull_request:
      types:
        - opened
        - edited
        - synchronize
        - reopened
    
permissions:
  checks: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
          fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: | 
          6.x
          8.x

    - name: Build
      run: ./build.sh build
      shell: bash

    - name: Test
      run: dotnet test -c Release --logger:"junit;LogFilePath=$(pwd)/output/test-results/junit-{assembly}-{framework}-test-results.xml" --no-build -f net8.0 --nologo
      shell: bash
      
    - name: Test Results
      uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
      if: always()
      with:
        fail_on_failure: true
        require_tests: true
        report_paths: '**/output/test-results/junit-*.xml'
